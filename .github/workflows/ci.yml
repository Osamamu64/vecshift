name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly published vulnerabilities in dependencies are caught between commits.
    - cron: "17 6 * * 1"

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs so a moved or compromised tag can't change what
# runs here. Dependabot keeps the pins (and the version comments) up to date.

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: uv run pytest --cov=vecshift --cov-report=term-missing

  integration:
    name: Integration (PostgreSQL ${{ matrix.postgres }} + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17"]
    services:
      postgres:
        # Docker Hub's mirror on Google: the same images (identical digests), without Docker
        # Hub's rate limit on anonymous pulls from CI runners.
        image: mirror.gcr.io/pgvector/pgvector:pg${{ matrix.postgres }}
        env:
          # A throwaway database that exists only for this job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VECSHIFT_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: uv run pytest tests/integration

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Known vulnerabilities in locked dependencies
        run: |
          uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit==2.10.1 --strict -r requirements-audit.txt
      - name: GitHub Actions workflow security
        run: uvx zizmor==1.30.1 --offline .github/workflows/

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv build
      - name: PyPI metadata and README render
        run: uvx twine==7.0.0 check --strict dist/*
      - name: The wheel installs and runs on its own
        run: |
          uv venv /tmp/wheel-test
          uv pip install --python /tmp/wheel-test/bin/python dist/*.whl
          /tmp/wheel-test/bin/vecshift --version
          /tmp/wheel-test/bin/python -c "from importlib.resources import files; assert files('vecshift').joinpath('assets/report.js').is_file()"

  demo:
    name: Docker image and demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Docker Hub's images through Google's mirror (same digests), to avoid rate limits.
      PYTHON_IMAGE: mirror.gcr.io/library/python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
      PGVECTOR_IMAGE: mirror.gcr.io/pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the offline demo end to end
        working-directory: demo
        run: |
          chmod a+w out
          docker compose up --build --abort-on-container-exit --exit-code-from vecshift
          test -s out/eval.html
      - name: Roll back
        working-directory: demo
        run: docker compose run --rm --entrypoint vecshift vecshift rollback --yes
      - if: always()
        working-directory: demo
        run: docker compose down --volumes
