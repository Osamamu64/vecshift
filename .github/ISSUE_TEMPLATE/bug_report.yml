name: Bug report
description: Something isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands and a minimal config. Remove any credentials.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VecShift version
      description: Output of `vecshift --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, and the vector stores and embedding providers involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove any credentials or private data.
      render: text
