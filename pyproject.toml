[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vecshift"
dynamic = ["version"]
description = "Safe, observable embedding migrations for any vector store and any embedding model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Osama Elshareef" }]
keywords = ["embeddings", "vector-database", "migration", "rag", "semantic-search", "opensearch", "pgvector", "qdrant"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Osamamu64/vecshift"
Repository = "https://github.com/Osamamu64/vecshift"
Issues = "https://github.com/Osamamu64/vecshift/issues"
Changelog = "https://github.com/Osamamu64/vecshift/blob/main/CHANGELOG.md"

[project.scripts]
vecshift = "vecshift.cli:app"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]
bench = [
    "httpx>=0.27",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.version]
path = "src/vecshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vecshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL with pgvector; set VECSHIFT_TEST_PG_DSN to run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
