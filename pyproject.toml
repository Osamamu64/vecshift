[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "vecshift"
dynamic = ["version", "readme"]
description = "Zero-downtime embedding model migrations for pgvector and Supabase: plan, re-embed, evaluate, and cut over safely."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Osama Elshareef" }]
keywords = ["embeddings", "embedding-migration", "pgvector", "supabase", "postgresql", "vector-database", "rag", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "pydantic>=2.6",
    "pyyaml>=6",
    "questionary>=2.0",
    "rich>=13",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/Osamamu64/vecshift"
Repository = "https://github.com/Osamamu64/vecshift"
Issues = "https://github.com/Osamamu64/vecshift/issues"
Changelog = "https://github.com/Osamamu64/vecshift/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Osamamu64/vecshift/tree/main/docs"

[project.scripts]
vecshift = "vecshift.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.version]
path = "src/vecshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vecshift"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "docs",
    "demo",
    "scripts/release_notes.py",
    "Dockerfile",
    ".github/workflows",
    "README.md",
    "CHANGELOG.md",
    "RELEASING.md",
    "SECURITY.md",
    "LICENSE",
    "NOTICE",
]
# Reports a local demo run left behind.
exclude = ["demo/out/*.html"]

# PyPI shows the README without the repository around it, so relative links and images
# are made absolute there. On GitHub the README keeps its relative links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(docs/[^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/Osamamu64/vecshift/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/images/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/Osamamu64/vecshift/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/Osamamu64/vecshift/blob/main/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL with pgvector; set VECSHIFT_TEST_PG_DSN to run",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S is flake8-bandit: security checks, enforced in CI.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
# random is only used for sampling and retry jitter, never for anything secret.
ignore = ["S311"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and fixed fake credentials for throwaway databases.
"tests/**" = ["S101", "S105", "S106", "S608"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
